name: Actualizar datos

# Descarga el registro de contratos, regenera los datos de la web y los sube.
# Vercel publica la web en cuanto llega el commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # lunes a las 05:17 UTC

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Descargar contratos (ingest)
        working-directory: backend
        run: cargo run --release -- ingest

      - name: Generar datos de la web (export)
        working-directory: backend
        run: cargo run --release -- export

      - name: Subir cambios
        run: |
          git config user.name "Ivgoji"
          git config user.email "ivgoji@users.noreply.github.com"
          git add data/places.json frontend/public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
